# Jira 23b. Runs the whole test suite and a production build of the dashboard on every push to
# main and every pull request, so a broken change is caught before it is deployed.
#
# Backend tests need MongoDB as a REPLICA SET (booking transactions require one), so the job starts
# a one-node replica set in Docker. The tests run against a database named *_test, never real data
# (src/db.js refuses anything else while tests run). No SMS/email/Gemini keys are set on purpose:
# the tests cover the "provider not configured" paths and never call out.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0
      MONGODB_DB_NAME: booking_call_center_test
      JWT_SECRET: ci-only-secret-used-by-no-other-environment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Start MongoDB as a one-node replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'db.hello().ok' && break || sleep 2; done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          for i in $(seq 1 30); do docker exec mongo mongosh --quiet --eval 'if (!db.hello().isWritablePrimary) quit(1)' && break || sleep 2; done
      - run: npm ci
      - run: npm test

  dashboard-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_SITE_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
